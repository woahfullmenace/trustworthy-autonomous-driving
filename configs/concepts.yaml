rule_version: concepts-v1.0
# Fractions of the full image, not percentages.
presence_min_fraction: 0.0001
cyclist:
  component_min_fraction: 0.0001
  min_horizontal_overlap: 0.25
  max_vertical_gap_fraction: 0.03
# [left, top, right, bottom], normalized; floor each boundary.
regions:
  road: [0.35, 0.50, 0.65, 0.90]
  near: [0.35, 0.65, 0.65, 0.90]
min_valid_region_fraction: 0.50
road_clear:
  min_road_fraction: 0.60
  max_obstacle_fraction_exclusive: 0.01
obstacle_close:
  min_obstacle_fraction: 0.05
audit:
  count: 30
  seed: 42
